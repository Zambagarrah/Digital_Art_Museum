# Postgres for local development only.
#
# Dokploy provisions its own Postgres service in production — see the
# Deployment section of the README. Start this with:
#
#   docker compose up -d
#
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: museum
      POSTGRES_PASSWORD: museum
      POSTGRES_DB: digital_art_museum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum -d digital_art_museum"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
